services:
  - type: web
    name: lms-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_DB
        value: library_management
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # e.g. https://your-app.vercel.app
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false # optional password fallback
      - key: GOOGLE_CLIENT_ID
        sync: false
